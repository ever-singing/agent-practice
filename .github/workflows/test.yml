name: CI Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整历史，确保能正确生成diff

      - name: 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖(如果有 requirements.txt)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: 跑一个简单检查(占位,以后换成真正的测试)
        run: |
          echo "开始检查代码..."
          python -c "print('CI 检查通过 ✅')"

      - name: 生成代码 diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff origin/${{ github.base_ref }} origin/${{ github.head_ref }} --output=diff.txt
          else
            git diff HEAD~1 HEAD --output=diff.txt || echo "首次提交，无历史可比对" > diff.txt
          fi

      - name: 运行 AI 代码审查
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REVIEW_PERSONA: "catgirl" # 可选值: normal / catgirl
          VERBOSE: "true" # 想安静点就改成 "false"
        run: python .github/workflows/code_review.py

      - name: 记录提交信息
        run: echo "COMMIT_MSG=$(git log -1 --pretty=%s || echo '无法获取提交信息')" >> $GITHUB_ENV

      - name: 通知飞书(无论成功失败都发送)
        if: always()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ env.COMMIT_MSG }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/workflows/notify_feishu.py
