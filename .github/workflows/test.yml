name: AI Code Review

# 触发条件：当有 Pull Request 提交或更新时触发
on:
  pull_request:
    branches: [main]
  # 如果你也想在直接push到main分支时触发，可以加上下面这段
  # push:
  #   branches: [ main ]

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
      # 第1步：拉取代码仓库内容
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整历史，确保diff能对比

      # 第2步：安装 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 第3步：安装依赖库（比如requests，用来调用DeepSeek API）
      - name: Install dependencies
        run: pip install requests

      # 第4步：生成代码改动的diff文件
      - name: Generate diff
        run: |
          git diff origin/${{ github.base_ref }} origin/${{ github.head_ref }} --output=diff.txt

      # 第5步：运行审查脚本，调用DeepSeek API
      - name: Run AI Code Review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python .github/workflows/code_review.py
